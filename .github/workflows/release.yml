name: Publish Release Draft
on: workflow_dispatch
jobs:

  # Before we do anything, run the existing test suite
  verify:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # Grab the current version
  get_version:
    uses: ./.github/workflows/get-version.yml

  # Create and upload release artifacts
  build:
    uses: ./.github/workflows/build-release.yml

  # Actually Create the Release
  create_release_draft:
    permissions:
      contents: write
    needs: [ verify, get_version, build ]
    runs-on: ubuntu-22.04
    steps:
      # Download the previously generated artifacts..
      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: List Downloaded Files..
        run: ls -lahR

      # Publish packages for the Cargo version.
      # A tag that already has a GitHub release (v1.0.0 today) must not be recreated
      # or rewritten: only artifacts missing from that release are uploaded. Title,
      # notes, and draft/prerelease state stay as they are. A version with no release
      # still becomes a draft prerelease, same as before.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.get_version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          deb="./debian-artifact/beacn-utility_${VERSION}-1_amd64.deb"
          rpm="./rpm-artifact/beacn-utility-${VERSION}-1.x86_64.rpm"

          for f in "$deb" "$rpm"; do
            if [[ ! -f "$f" ]]; then
              echo "Missing release artifact: $f" >&2
              exit 1
            fi
          done

          if view_err="$(gh release view "$tag" --json tagName --jq .tagName 2>&1)"; then
            echo "Release ${tag} already exists."
            echo "Leaving the tag, title, notes, and draft/prerelease state unchanged."
            existing="$(gh release view "$tag" --json assets --jq '.assets[].name')"
            for f in "$deb" "$rpm"; do
              base="$(basename "$f")"
              if printf '%s\n' "$existing" | grep -Fxq "$base"; then
                echo "Asset ${base} is already attached to ${tag}; skipping."
              else
                echo "Uploading ${base} to existing release ${tag}."
                gh release upload "$tag" "$f"
              fi
            done
          else
            if ! printf '%s\n' "$view_err" | grep -Eqi 'release not found|HTTP 404'; then
              printf '%s\n' "$view_err" >&2
              exit 1
            fi
            echo "No release for ${tag}. Creating a draft prerelease."
            # GitHub ignores target_commitish when the tag already exists, so this
            # does not move a tag that was published without a release object.
            gh release create "$tag" "$deb" "$rpm" \
              --draft \
              --prerelease \
              --title "Release ${VERSION}" \
              --notes "Put Changelog Here!" \
              --target "$TARGET_SHA"
          fi